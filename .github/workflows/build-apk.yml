name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'
        continue-on-error: true

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Install Root & App Dependencies
        run: |
          if [ -f package.json ]; then npm install --legacy-peer-deps; fi
          if [ -d app ] && [ -f app/package.json ]; then cd app && npm install --legacy-peer-deps && cd ..; fi

      - name: Build Web Assets
        run: |
          if [ -f package.json ]; then npm run build --if-present; fi
          if [ -d app ] && [ -f app/package.json ]; then cd app && npm run build --if-present && cd ..; fi

      - name: Sync Capacitor Android
        run: |
          npx cap sync android || (cd app && npx cap sync android)

      - name: Ensure Executable Permissions on Gradle Wrapper
        run: |
          find . -name "gradlew" -exec chmod +x {} +

      - name: Build Android Debug APK
        run: |
          export GRADLE_OPTS="-Xmx4096m -Dorg.gradle.daemon=false"
          if [ -f android/gradlew ]; then
            cd android && ./gradlew assembleDebug --stacktrace
          elif [ -f app/android/gradlew ]; then
            cd app/android && ./gradlew assembleDebug --stacktrace
          else
            ./gradlew assembleDebug --stacktrace
          fi

      - name: Locate and Stage APK
        run: |
          mkdir -p output-apk
          find . -type f -name "*debug.apk" -exec cp {} output-apk/mokhtas-hifd-saha.apk \;
          ls -la output-apk/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mokhtas-hifd-saha-apk
          path: output-apk/mokhtas-hifd-saha.apk
          retention-days: 14