name: Build Universal Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - name: Accept Android SDK Licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Root and App Dependencies
        run: |
          npm ci || npm install
          if [ -d "app" ] && [ -f "app/package.json" ]; then
            cd app && (npm ci || npm install) && cd ..
          fi

      - name: Build Web Application
        run: |
          npm run build --if-present
          if [ -d "app" ] && [ -f "app/package.json" ]; then
            cd app && npm run build --if-present && cd ..
          fi

      - name: Sync Capacitor Android
        run: |
          if [ -d "app/android" ]; then
            cd app && npx cap sync android && cd ..
          else
            npx cap sync android
          fi

      - name: Grant Execute Permissions to Gradle
        run: find . -name "gradlew" -exec chmod +x {} +

      - name: Build Release APK with Gradle
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError"
        run: |
          GRADLE_DIR=$(dirname $(find . -name "gradlew" | head -n 1))
          echo "Building in $GRADLE_DIR"
          cd "$GRADLE_DIR"
          ./gradlew assembleRelease -Pandroid.injected.testOnly=false --no-daemon

      - name: Align and Sign Universal Release APK
        run: |
          mkdir -p output_apk
          
          # Find Android build tools path dynamically
          BUILD_TOOLS_DIR=$(find $ANDROID_HOME/build-tools/ -maxdepth 1 -mindepth 1 | sort -V | tail -n 1)
          echo "Using Android Build Tools from: $BUILD_TOOLS_DIR"
          
          # Find generated unsigned release apk
          RAW_APK=$(find . -name "*release*.apk" -not -path "*/output_apk/*" | head -n 1)
          echo "Found raw APK: $RAW_APK"
          
          # Create permanent keystore
          keytool -genkeypair -v -keystore release.keystore -alias releaseKey -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=HSP, OU=App, O=HSP, L=Algiers, S=Algiers, C=DZ"
          
          # Align APK for Android memory optimization
          "$BUILD_TOOLS_DIR/zipalign" -v -p 4 "$RAW_APK" output_apk/aligned.apk
          
          # Sign APK with v2/v3 signing schemes
          "$BUILD_TOOLS_DIR/apksigner" sign --ks release.keystore --ks-pass pass:123456 --key-pass pass:123456 --out output_apk/mokhtas-hifd-saha.apk output_apk/aligned.apk
          
          # Verify signature
          "$BUILD_TOOLS_DIR/apksigner" verify output_apk/mokhtas-hifd-saha.apk

      - name: Upload Universal Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: mokhtas-hifd-saha-release
          path: output_apk/mokhtas-hifd-saha.apk
          retention-days: 7