name: Build Universal Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - name: Accept Android SDK Licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Dependencies
        run: |
          npm ci || npm install
          if [ -d "app" ]; then cd app && (npm ci || npm install) && cd ..; fi

      - name: Build Web Assets
        run: |
          npm run build --if-present
          if [ -d "app" ]; then cd app && npm run build --if-present && cd ..; fi

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Grant Execute Permission to Gradle Wrapper
        run: |
          find . -name "gradlew" -exec chmod +x {} +

      - name: Build Release APK with Gradle
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError"
        run: |
          cd app/android || cd android
          ./gradlew assembleRelease -Pandroid.injected.testOnly=false --no-daemon

      - name: Generate Signing Keystore
        run: |
          keytool -genkeypair -v -keystore release.keystore -alias app-alias -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=HSP, OU=App, O=HSP, L=Algiers, S=Algiers, C=DZ"

      - name: Sign Release APK
        run: |
          mkdir -p output_apk
          RAW_APK=$(find . -name "*release-unsigned.apk" -o -name "*release.apk" | head -n 1)
          $ANDROID_HOME/build-tools/34.0.0/apksigner sign --ks release.keystore --ks-pass pass:123456 --key-pass pass:123456 --out output_apk/mokhtas-hifd-saha.apk "$RAW_APK"

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: mokhtas-hifd-saha-release
          path: output_apk/mokhtas-hifd-saha.apk
          retention-days: 7