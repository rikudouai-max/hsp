name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'app/package-lock.json'

      - name: Install Root Dependencies
        run: |
          if [ -f package.json ]; then
            npm install --legacy-peer-deps || true
          fi

      - name: Install App Dependencies
        working-directory: ./app
        run: npm install --legacy-peer-deps

      - name: Build Web Application
        working-directory: ./app
        run: npm run build

      - name: Sync Capacitor Android
        working-directory: ./app
        run: npx cap sync android

      - name: Set Executable Permission for Gradlew
        run: chmod +x ./app/android/gradlew

      - name: Build Android Release/Debug APK
        working-directory: ./app/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare APK Output
        run: |
          mkdir -p build-output
          cp app/android/app/build/outputs/apk/debug/app-debug.apk build-output/mokhtas-hifd-saha.apk
          echo "APK created successfully: build-output/mokhtas-hifd-saha.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mokhtas-hifd-saha.apk
          path: build-output/mokhtas-hifd-saha.apk
          retention-days: 30
